<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRC 100 Day Challenge — Sports Breakdown</title>
<link rel="stylesheet" href="style.css">
<style>
  .sport-row{
    background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 20px;margin-bottom:12px;box-shadow:var(--shadow);
  }
  .sport-row-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;gap:12px;flex-wrap:wrap}
  .sport-row-name{font-family:var(--display);font-size:20px;letter-spacing:0.3px}
  .sport-row-meta{font-size:12px;color:var(--ink-faint)}
  .sport-row-leaders{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .sport-leader{font-size:14px;font-weight:600;white-space:nowrap;display:inline-flex;flex-direction:column;align-items:center;text-align:center}
  .sport-rank{
    display:inline-flex;align-items:center;justify-content:center;
    width:20px;height:20px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;
    margin-bottom:4px;
  }
  .sport-leader-team{display:block;font-size:11px;font-weight:500;color:var(--ink-faint);margin-top:1px}
  .sport-sep{color:var(--ink-faint);font-size:14px;margin:0 2px;align-self:center}
</style>
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a class="nav-brand" href="index.html">
      <span class="mark">SRC</span>
      <span class="name">100 DAY CHALLENGE</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html" data-page="overview">Overview</a></li>
      <li><a href="teams.html" data-page="teams">Teams</a></li>
      <li><a href="individuals.html" data-page="individuals">Individuals</a></li>
      <li><a href="weekly.html" data-page="weekly">Weekly</a></li>
      <li><a href="sports.html" data-page="sports">Sports</a></li>
      <li><a href="challenges.html" data-page="challenges">Challenges</a></li>
    </ul>
    <span class="sync-badge" id="syncBadge"></span>
  </div>
</nav>

<header class="hero">
  <div class="wrap">
    <p class="eyebrow animate-fade-up">Sports breakdown</p>
    <h1 class="animate-fade-up" style="animation-delay:0.2s">Top performers by sport</h1>
    <p class="sub animate-fade-up" style="animation-delay:0.3s">See who's leading in each sport across the challenge.</p>
  </div>
</header>

<main class="section">
  <div class="wrap">
    <div class="section-head">
      <h2>All sports</h2>
      <div class="lb-controls" style="align-items:center">
        <button class="filter-btn active" data-sport-filter="all">All time</button>
        <button class="filter-btn" data-sport-filter="7">Last 7 days</button>
        <button class="filter-btn" data-sport-filter="14">Last 14 days</button>
        <button class="filter-btn" data-sport-filter="30">Last 30 days</button>
        <span style="font-size:12px;color:var(--ink-faint);margin-left:8px">or</span>
        <input type="date" class="filter-date" id="sportDateFrom" title="From date">
        <span style="font-size:12px;color:var(--ink-faint)">to</span>
        <input type="date" class="filter-date" id="sportDateTo" title="To date">
      </div>
    </div>
    <div id="sportsGrid"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>SRC 100 Day Challenge — sports breakdown</span>
    <span id="footSync"></span>
  </div>
</footer>

<!-- Loading toast -->
<div class="loading-toast" id="loadingToast">
  <div class="loading-spinner"></div>
  <span>Fetching latest data…</span>
</div>

<script src="dashboard.js"></script>
<script>
markActiveNav('sports');

let _fullData = null;
let _sportDateRange = null;

fetchDashboard().then(data => {
  _fullData = data;
  renderSyncBadge(document.getElementById('syncBadge'), data.generated_at);
  document.getElementById('footSync').textContent = 'Last synced: ' + new Date(data.generated_at).toLocaleString('en-IN');
  renderSports(data);
  setupSportFilter();
}).catch(err => {
  document.getElementById('sportsGrid').innerHTML =
    '<div class="empty-state"><div class="big">Could not load data</div>' + err.message + '</div>';
});

window.addEventListener('dashboardFreshData', e => {
  _fullData = e.detail;
  renderSports(_fullData);
});

function setupSportFilter() {
  const buttons = document.querySelectorAll('[data-sport-filter]');
  const dateFrom = document.getElementById('sportDateFrom');
  const dateTo = document.getElementById('sportDateTo');

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      dateFrom.value = '';
      dateTo.value = '';

      const val = btn.dataset.sportFilter;
      if (val === 'all') {
        _sportDateRange = null;
      } else {
        const days = parseInt(val);
        const to = new Date();
        const from = new Date();
        from.setDate(from.getDate() - days);
        _sportDateRange = { from: from.toISOString().slice(0, 10), to: to.toISOString().slice(0, 10) };
      }
      renderSports(_fullData);
    });
  });

  const applyCustomRange = () => {
    const from = dateFrom.value;
    const to = dateTo.value;
    if (from && to) {
      buttons.forEach(b => b.classList.remove('active'));
      _sportDateRange = { from, to };
      renderSports(_fullData);
    }
  };
  dateFrom.addEventListener('change', applyCustomRange);
  dateTo.addEventListener('change', applyCustomRange);
}

function renderSports(data) {
  let breakdown = data.daily_breakdown || [];

  // Apply date filter
  if (_sportDateRange) {
    breakdown = breakdown.filter(r => r.date >= _sportDateRange.from && r.date <= _sportDateRange.to);
  }

  // Build: sport -> { name -> totalPoints }
  const sportMap = {};
  breakdown.forEach(r => {
    if (!r.sport) return;
    if (!sportMap[r.sport]) sportMap[r.sport] = {};
    sportMap[r.sport][r.name] = (sportMap[r.sport][r.name] || 0) + r.points;
  });

  // Sort sports by total points (most popular first)
  const sportsSorted = Object.keys(sportMap).sort((a, b) => {
    const totalA = Object.values(sportMap[a]).reduce((s, v) => s + v, 0);
    const totalB = Object.values(sportMap[b]).reduce((s, v) => s + v, 0);
    return totalB - totalA;
  });

  const sportColors = ['#E2542F', '#2F7A4F', '#2C6E9E', '#F2A93B', '#6B4FA0', '#C24B7C', '#1F5636', '#B23F20'];

  if (sportsSorted.length === 0) {
    document.getElementById('sportsGrid').innerHTML =
      '<div class="empty-state"><div class="big">No activity data</div>Sports will appear once participants log activities.</div>';
    return;
  }

  // Build name -> team lookup
  const nameTeamMap = {};
  breakdown.forEach(r => { if (r.name && r.team) nameTeamMap[r.name] = r.team; });

  const rankColors = ['#E2542F', '#2C6E9E', '#2F7A4F', '#6B4FA0', '#F2A93B'];

  document.getElementById('sportsGrid').innerHTML = sportsSorted.map((sport, sIdx) => {
    const participants = Object.entries(sportMap[sport])
      .sort((a, b) => b[1] - a[1])
      .slice(0, 5);
    const totalPts = Object.values(sportMap[sport]).reduce((s, v) => s + v, 0);
    const totalParticipants = Object.keys(sportMap[sport]).length;
    const color = sportColors[sIdx % sportColors.length];

    const leadersStr = participants.map((entry, i) => {
      const team = nameTeamMap[entry[0]] || '';
      return `<span class="sport-leader"><span class="sport-rank" style="background:${rankColors[i]}">${i + 1}</span>${entry[0]} (${formatNumber(entry[1])})<span class="sport-leader-team">${team}</span></span>`;
    }).join('<span class="sport-sep">|</span>');

    return `
      <div class="sport-row" style="border-left:5px solid ${color}">
        <div class="sport-row-head">
          <strong class="sport-row-name">${sport}</strong>
          <span class="sport-row-meta">${totalParticipants} participants · ${formatNumber(totalPts)} pts</span>
        </div>
        <div class="sport-row-leaders">${leadersStr}</div>
      </div>
    `;
  }).join('');
}
</script>
</body>
</html>
